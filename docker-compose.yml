services:
  mongodb:
    image: mongo:7
    container_name: omnichain-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: omnichain-server
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/omniassets
      - PORT=3000
      - MNEMONIC=${MNEMONIC:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-admin-secret-change-me}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnichain-app
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongodb_data:
