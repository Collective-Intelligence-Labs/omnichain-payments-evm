services:
  mongodb:
    image: mongo:7
    container_name: omnichain-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE: /omnichain-payments-evm/
        VITE_API_URL: /api
    container_name: omnichain-app
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/omniassets
      - PORT=3000
      - MNEMONIC=${MNEMONIC:-}
      - ADMIN_SECRET=${ADMIN_SECRET:-admin-secret-change-me}
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/api/admin/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
