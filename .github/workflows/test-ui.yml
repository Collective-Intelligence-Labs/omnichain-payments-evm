name: Test Deployed UI

on:
  workflow_run:
    workflows: ['Deploy UI to GitHub Pages']
    types:
      - completed
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployed URL to test'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    if: >
      ${{ github.event.workflow_run.conclusion == 'success' ||
          github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Determine deployed URL
        id: url
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            echo "base=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          else
            OWNER="${{ github.repository_owner }}"
            echo "base=https://${OWNER}.github.io/omnichain-payments-evm/ui/" >> "$GITHUB_OUTPUT"
          fi

      - name: Run E2E tests
        run: npx playwright test
        env:
          DEPLOY_URL: ${{ steps.url.outputs.base }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
