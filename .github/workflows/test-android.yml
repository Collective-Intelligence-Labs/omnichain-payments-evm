name: Android Build Test

on:
  push:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/test-android.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'android/**'
      - '.github/workflows/test-android.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test-android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: android/app/build/reports/
          retention-days: 7

      - name: Create issue on failure
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"
          TRIGGER="${{ github.event_name }}"

          TITLE="Android build failure on ${TRIGGER} (${BRANCH})"
          BODY=$(cat <<'EOF'
          ## Android Build Failure

          **Trigger:** {trigger}
          **Branch:** `{branch}`
          **Commit:** `{commit}`
          **Workflow Run:** [View logs]({run_url})

          The automated Android build test failed. Please investigate the build and test output in the workflow logs.

          ### Steps to reproduce locally
          ```bash
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          ./gradlew test
          ```

          ---
          *This issue was automatically created by the [Android Build Test](../actions/workflows/test-android.yml) workflow.*
          EOF
          )

          BODY="${BODY//\{trigger\}/$TRIGGER}"
          BODY="${BODY//\{branch\}/$BRANCH}"
          BODY="${BODY//\{commit\}/$COMMIT}"
          BODY="${BODY//\{run_url\}/$RUN_URL}"

          # Check for existing open issue with similar title to avoid duplicates
          EXISTING=$(gh issue list \
            --label "android-build-failure" \
            --state open \
            --json number,title \
            --jq '.[].title' 2>/dev/null || echo "")

          if echo "$EXISTING" | grep -qF "Android build failure"; then
            echo "Open android-build-failure issue already exists, skipping creation."
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "android-build-failure" \
              --assignee "AlexShkor"
          fi
